name: TrafficMonitor

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build TrafficMonitor (Windows x64)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build release executable
        run: cargo build --release -p traffic_monitor

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: TrafficMonitor-windows-x64
          path: target/release/traffic_monitor.exe
          if-no-files-found: error
